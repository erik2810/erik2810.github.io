<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0c">
    <title>{{ if .IsHome }}Erik Löffelholz · Research Portfolio{{ else }}{{ .Title }} · Erik Löffelholz{{ end }}</title>
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:site_name" content="Erik Löffelholz">
    <meta property="og:title" content="{{ if .IsHome }}Erik Löffelholz · Research Portfolio{{ else }}{{ .Title }}{{ end }}">
    <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ "og-image.png" | absURL }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ if .IsHome }}Erik Löffelholz · Research Portfolio{{ else }}{{ .Title }}{{ end }}">
    <meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="twitter:image" content="{{ "og-image.png" | absURL }}">
    {{ if .IsHome }}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Erik Löffelholz",
      "url": {{ .Permalink | jsonify }},
      "jobTitle": "Machine Learning Engineer",
      "description": {{ .Site.Params.description | jsonify }},
      "address": { "@type": "PostalAddress", "addressLocality": "Leipzig", "addressCountry": "DE" },
      "alumniOf": { "@type": "CollegeOrUniversity", "name": "Leipzig University" },
      "knowsAbout": ["Mathematical Physics", "Quantum Field Theory", "Differentiable Simulation", "Geometric Machine Learning", "Scientific Machine Learning"],
      "sameAs": [
        "https://github.com/erik2810",
        "https://www.linkedin.com/in/eriklfholz/"
      ]
    }
    </script>
    {{ else if and .IsPage (eq .Section "blog") }}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": {{ .Title | jsonify }},
      "description": {{ or .Description .Summary | plainify | jsonify }},
      "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
      "url": {{ .Permalink | jsonify }},
      "image": {{ "og-image.png" | absURL | jsonify }},
      "author": { "@type": "Person", "name": "Erik Löffelholz", "url": {{ .Site.BaseURL | jsonify }} }
    }
    </script>
    {{ end }}
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
    <link rel="stylesheet" href="/css/fonts.css">
    {{ partial "extend_head.html" . }}
    {{ block "head" . }}{{ end }}
</head>
<body{{ with .Params.bodyclass }} class="{{ . }}"{{ end }}>

    {{ partial "nav.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    {{ with .Site.Params.goatcounter }}
    <script data-goatcounter="https://{{ . }}.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    {{ end }}

</body>
</html>
